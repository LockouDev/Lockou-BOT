<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Calculadora de Porcentagem</title>
    <link rel="icon" href="https://raw.githubusercontent.com/LockouDev/Lockou-BOT/refs/heads/gh-pages/assets/images/Lockou.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), #252934;
            color: white;
        }

        .container {
            margin-top: 50px;
        }

        h3 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        #resultText {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffc107;
        }

    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">Roblox Calculadora de Porcentagem em 70%</h1>

        <div class="mb-4">
            <label for="totalInput" class="form-label">Insira o valor total:</label>
            <input type="number" id="totalInput" class="form-control" placeholder="Digite o valor total" step="1"
                min="1">
        </div>

        <div class="text-center">
            <h3>Resultado:</h3>
            <p id="resultText" class="text-warning">Insira um valor total e clique em calcular</p>
        </div>
    </div>

    <script>

        const totalInput = document.getElementById('totalInput');
        const resultText = document.getElementById('resultText');

        totalInput.addEventListener('input', () => {
            const totalValue = parseFloat(totalInput.value);

            if (!totalValue || totalValue <= 0) {
                resultText.innerText = "Insira um valor total válido";
                return;
            }

            const originalValue = Math.ceil(totalValue / 0.7);
            resultText.innerText = `${originalValue}`;
        });

    </script>
    
</body>

</html>
