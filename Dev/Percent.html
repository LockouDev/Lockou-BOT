<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Percentage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), #252934;
            color: white;
        }
        .container {
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">Roblox Percentage Calculator</h1>

        <div class="mb-4">
            <label for="totalInput" class="form-label">Enter Total Value:</label>
            <input type="number" id="totalInput" class="form-control" placeholder="Enter the total amount" step="1" min="1">
        </div>

        <div class="mb-4">
            <button class="btn btn-primary w-100" onclick="calculate70Percent()">Calculate 70%</button>
        </div>

        <div class="text-center">
            <h3>Result</h3>
            <p id="resultText" class="text-warning">Enter a total value and click calculate.</p>
        </div>
    </div>

    <script>
        function calculate70Percent() {
            const totalInput = document.getElementById('totalInput').value;
            if (!totalInput || totalInput <= 0) {
                document.getElementById('resultText').innerText = "Please enter a valid total value.";
                return;
            }

            const totalValue = parseInt(totalInput, 10);
            const percentageValue = Math.floor(totalValue * 0.7); // Calcula 70% arredondado para baixo
            document.getElementById('resultText').innerText = `70% of ${totalValue} is ${percentageValue}.`;
        }
    </script>
</body>

</html>
