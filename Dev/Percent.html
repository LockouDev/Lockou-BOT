<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockou BOT - Roblox Percentage Calculator</title>
    <link rel="icon"
        href="https://raw.githubusercontent.com/LockouDev/Lockou-BOT/refs/heads/gh-pages/assets/images/Lockou.ico">
    <link rel="stylesheet" href="style.css">
</head>
<div class="container">
    <h1 class="text-center mb-4">Roblox Percentage Calculator</h1>

    <div class="mb-4">
        <label for="totalInput" class="form-label">Enter Total Value:</label>
        <input type="number" id="totalInput" class="form-control" placeholder="Enter the total amount" step="1" min="1">
    </div>

    <div class="mb-4">
        <button class="btn btn-primary w-100" onclick="calculate70Percent()">Calculate 70%</button>
    </div>

    <div class="text-center">
        <h3>Result</h3>
        <p id="resultText" class="text-warning">Enter a total value and click calculate.</p>
    </div>
</div>
</html>
